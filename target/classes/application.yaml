server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: payment-system
  lifecycle:
    timeout-per-shutdown-phase: 30s

# Database
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USER:postgreSQL}
    password: ${DB_PASSWORD:Emma007_}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

# JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

# Flyway
  flyway:
    url: jdbc:postgresql://localhost:5432/payment_db
    user: postgreSQL
    password: Emma007_
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

# GraphQL
  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:false}
      path: /graphiql
    path: /graphql
    websocket:
      path: /graphql-ws
    schema:
      printer:
        enabled: false
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
      allowed-methods: GET,POST
      allow-credentials: true

# Cache
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

# Security / JWT
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-256-bits-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Payment Processing
  payment:
    processing-fee-percent: 0.029
    fixed-fee: 0.30
    max-transaction-amount: 50000
    daily-limit: 100000
    idempotency-ttl-hours: 24

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      paymentProcessor:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5

  retry:
    instances:
      paymentProcessor:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    circuitbreakers:
      enabled: true

# Logging
logging:
  level:
    com:
      payments: INFO
    org:
      springframework:
        graphql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
