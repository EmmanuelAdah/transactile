spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.graphql.graphiql.enabled=true
app.jwt.secret=test-secret-key-for-testing-purposes-only-256bits-minimum
logging.level.com.payments=DEBUG
resilience4j.circuitbreaker.instances.paymentProcessor.slidingWindowSize=5
app.payment.processing-fee-percent=0.029
app.payment.fixed-fee=0.30
app.payment.max-transaction-amount=50000
app.payment.daily-limit=100000
app.payment.idempotency-ttl-hours=24
